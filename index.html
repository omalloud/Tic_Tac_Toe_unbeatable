<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <title>Game - Tic Tac Toe </title>
</head>
<body>
    <main class="game-shell">
        <p class="tag">UNBEATABLE AI</p>
        <h1>Tic Tac Toe</h1>
        <p class="copyright">Created by <a href="https://ossama.ma/" target="_blank">omalloud</a></p>
        <p class="copyright">Github <a href="https://github.com/omalloud/Tic_Tac_Toe_unbeatable" target="_blank">repo</a></p>

        <table>
            <tr>
                <td class="cell" id="0"></td>
                <td class="cell" id="1"></td>
                <td class="cell" id="2"></td>
            </tr>
            <tr>
                <td class="cell" id="3"></td>
                <td class="cell" id="4"></td>
                <td class="cell" id="5"></td>
            </tr>
            <tr>
                <td class="cell" id="6"></td>
                <td class="cell" id="7"></td>
                <td class="cell" id="8"></td>
            </tr>
        </table>

        <div class="gameOver">
            <p class="text"></p>
            <button onClick="resetGame()">Replay</button>
        </div>
    </main>

    <script src="./app.js"></script>
</body>
</html>
